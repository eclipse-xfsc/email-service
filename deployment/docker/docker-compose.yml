version: "3.8"

networks:
  nats:
    driver: bridge

services:
  email-service:
    container_name: email-service
    build:
      context: ../../.
      dockerfile: ./deployment/docker/Dockerfile

    ports:
      - "8080:8080"

    depends_on:
      - nats
      - mailhog 

    networks:
      - nats

    env_file:
      - ../../.env

  nats:
    image: nats:latest
    restart: always
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - nats

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: always
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - nats

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      - nats
    networks:
      - nats
    entrypoint: ["/bin/sh", "/scripts/nats-init.sh"]
    volumes:
      - ./scripts/nats-init.sh:/scripts/nats-init.sh